name: Keep Supabase awake

# Backup to the Vercel cron: pings the keep-alive endpoint every 3 days so the
# free-tier database is never idle for 7 days.
on:
  schedule:
    - cron: "17 5 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping keep-alive endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail --silent --show-error --retry 3 --retry-delay 15 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            https://www.attestly.online/api/cron/keepalive

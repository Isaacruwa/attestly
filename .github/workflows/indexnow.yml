name: IndexNow ping

# After every site change, tell IndexNow search engines (Bing, Yandex,
# DuckDuckGo, Seznam, Naver) which URLs exist. Google does not use IndexNow.
# Two keys: KEY_MAIN works with Yandex; KEY_BING is a fresh key for Bing.
on:
  push:
    branches: [main]
    paths:
      - "src/app/**"
      - "public/**"
      - ".github/workflows/indexnow.yml"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      KEY_MAIN: "8d870c9f070445198978cbb111be2f1b"
      KEY_BING: "2f22578a239f245e2a126a093a3971a4"
    steps:
      - name: Wait for the Vercel deploy to finish
        if: github.event_name == 'push'
        run: sleep 150

      - name: Check both key files are live and exact
        run: |
          for k in "$KEY_MAIN" "$KEY_BING"; do
            body=$(curl -sS -L "https://www.attestly.online/$k.txt" | tr -d '\r\n')
            if [ "$body" = "$k" ]; then echo "key $k OK"; else echo "key $k MISMATCH (got: $body)"; fi
          done

      - name: Submit every sitemap URL to IndexNow
        run: |
          set -uo pipefail
          curl -fsS --retry 3 --retry-delay 10 "https://www.attestly.online/sitemap.xml" -o sitemap.xml
          ok=0
          submit() { # endpoint key
            python3 - "$2" <<'PY' > payload.json
          import json, re, sys
          key = sys.argv[1]
          urls = re.findall(r"<loc>([^<]+)</loc>", open("sitemap.xml").read())
          host = "www.attestly.online"
          print(json.dumps({"host": host, "key": key, "keyLocation": f"https://{host}/{key}.txt", "urlList": urls}))
          PY
            code=$(curl -sS -o response.txt -w "%{http_code}" -X POST "$1" -H "Content-Type: application/json; charset=utf-8" --data @payload.json || echo 000)
            echo "$1 (key ${2:0:6}...) -> HTTP $code"; cat response.txt; echo
            if [ "$code" = "200" ] || [ "$code" = "202" ]; then ok=1; fi
          }
          submit "https://yandex.com/indexnow" "$KEY_MAIN"
          submit "https://api.indexnow.org/indexnow" "$KEY_BING"
          submit "https://www.bing.com/indexnow" "$KEY_BING"
          if [ "$ok" != "1" ]; then exit 1; fi

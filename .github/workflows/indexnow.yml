name: IndexNow ping

# After every site change, tell IndexNow search engines (Bing, Yandex,
# DuckDuckGo, Seznam, Naver) which URLs exist. Google does not use IndexNow.
on:
  push:
    branches: [main]
    paths:
      - "src/app/**"
      - "public/**"
      - ".github/workflows/indexnow.yml"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for the Vercel deploy to finish
        run: sleep 150

      - name: Submit every sitemap URL to IndexNow
        env:
          INDEXNOW_KEY: "8d870c9f070445198978cbb111be2f1b"
        run: |
          set -euo pipefail
          curl -fsS --retry 3 --retry-delay 10 "https://www.attestly.online/sitemap.xml" -o sitemap.xml
          python3 - <<'PY' > payload.json
          import json, os, re
          urls = re.findall(r"<loc>([^<]+)</loc>", open("sitemap.xml").read())
          host = "www.attestly.online"
          key = os.environ["INDEXNOW_KEY"]
          print(json.dumps({"host": host, "key": key, "keyLocation": f"https://{host}/{key}.txt", "urlList": urls}))
          PY
          echo "Submitting $(python3 -c 'import json;print(len(json.load(open("payload.json"))["urlList"]))') URLs"
          curl -sS -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            --data @payload.json -w "\nIndexNow HTTP %{http_code}\n"

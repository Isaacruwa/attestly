name: IndexNow ping

# After every site change, tell IndexNow search engines (Bing, Yandex,
# DuckDuckGo, Seznam, Naver) which URLs exist. Google does not use IndexNow.
on:
  push:
    branches: [main]
    paths:
      - "src/app/**"
      - "public/**"
      - ".github/workflows/indexnow.yml"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      INDEXNOW_KEY: "8d870c9f070445198978cbb111be2f1b"
    steps:
      - name: Wait for the Vercel deploy to finish
        if: github.event_name == 'push'
        run: sleep 150

      - name: Check the key file is live and exact
        run: |
          set -u
          url="https://www.attestly.online/${INDEXNOW_KEY}.txt"
          info=$(curl -sS -L -o keyfile.txt -D headers.txt -w "%{http_code} final=%{url_effective} redirects=%{num_redirects} type=%{content_type}" "$url" || true)
          echo "Key file fetch: $info"
          echo "--- response headers"; cat headers.txt
          echo "--- body (hex)"; xxd keyfile.txt | head -5
          if [ "$(tr -d '\r\n' < keyfile.txt)" != "$INDEXNOW_KEY" ]; then
            echo "KEY FILE MISMATCH: the live file does not contain the key"; exit 1
          fi
          echo "Key file OK"

      - name: Submit every sitemap URL to IndexNow
        run: |
          set -euo pipefail
          curl -fsS --retry 3 --retry-delay 10 "https://www.attestly.online/sitemap.xml" -o sitemap.xml
          python3 - <<'PY' > payload.json
          import json, os, re
          urls = re.findall(r"<loc>([^<]+)</loc>", open("sitemap.xml").read())
          host = "www.attestly.online"
          key = os.environ["INDEXNOW_KEY"]
          print(json.dumps({"host": host, "key": key, "keyLocation": f"https://{host}/{key}.txt", "urlList": urls}))
          PY
          echo "Submitting $(python3 -c 'import json;print(len(json.load(open("payload.json"))["urlList"]))') URLs"
          ok=0
          for ep in "https://api.indexnow.org/indexnow" "https://www.bing.com/indexnow" "https://yandex.com/indexnow"; do
            code=$(curl -sS -o response.txt -w "%{http_code}" -X POST "$ep" \
              -H "Content-Type: application/json; charset=utf-8" \
              --data @payload.json || echo 000)
            echo "$ep -> HTTP $code"; cat response.txt || true; echo
            # 200 = accepted, 202 = accepted (key validation pending)
            if [ "$code" = "200" ] || [ "$code" = "202" ]; then ok=1; fi
          done
          if [ "$ok" != "1" ]; then exit 1; fi
